train_dataset:
  module: src.data.div2k_dataset.DIV2KDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [0.470, 0.447, 0.408]
        std: [0.270, 0.266, 0.281]
        normalize: true
        crop_size: [256, 256]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: [256, 256]
  args:
    variant: train
    subset_classes: 25
    subset_samples: 131072

val_dataset:
  module: src.data.div2k_dataset.DIV2KDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: true
        crop_size: [256, 256]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: [256, 256]
        normalize: false
  args:
    variant: val
    subset_classes: 1
    subset_samples: 1024

test_dataset:
  module: src.data.kodak_dataset.KodakDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: true
        crop_size: [512, 512]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: [512, 512]
  args: {}

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_b
    encoder_embed_dim: 128
    encoder_dims: [ 128, 256, 512 ]
    encoder_depths: [ 2, 6, 24 ]
    encoder_num_heads: [ 4, 8, 16 ]
    encoder_window_size: [ 10, 10 ]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [ 24, 6, 2 ]
    decoder_dims: [ 512, 256, 128, 64 ]
    decoder_num_heads: [ 16, 8, 4 ]
    decoder_window_size: [ [ 10, 10 ], [ 10, 10 ], [ 10, 10 ] ]
    decoder_mlp_ratio: [ 4, 4, 4 ]
    decoder_sd_factor: 0.05
    bottleneck_dim: 384
    no_compress: false
    checkpointing: true

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 1e-4
  first_lr: !!float 1e-4
  second_lr: !!float 1e-4
  third_lr: !!float 1e-4
  fourth_lr: !!float 1e-4

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  enabled: false
  args:
    total_iters: 10
    start_factor: 1.0
    end_factor: 0.25

aux_optimizer:
  module: lion_pytorch.Lion
  args:
    lr: !!float 5e-4

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: false
  args:
    eta_min: 0.0005
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0.1

rd_loss:
  enabled: true
  lambda: !!float 1e-5

epochs: 5000
log_frequency: 100
accumulation_steps: 1

aux_optimizer_delay: 0

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-B-IC
    version: 0.12.4

project_name: INZ
task_name: v0.12.4 SWIN-B Transformer Autoencoder based Image Compression
comment: |
  - convolution after patch splitting
  - remove redundant norms
  - switch to random crop with DIV2K dataset
  - introduce linear projection to smaller bottleneck 
  - remove last SWIN stage in behalf of larger batch, larger window size, deeper remaining stages and, last but not
    least, larger spatial dimensions
  - back to AdamW for stable training
  - train on smaller images - larger images are not worth cutting costs of every aspect of training