dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X2
    subset_classes: 25
    subset_samples: 40

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: true
    encoder_type: gdn_swin_v2_s
    decoder_depths: [2, 18, 2, 2]

dataloader:
  args:
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0002

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: false
  args:
    base_lr: 0.00005
    max_lr: 0.0002
    mode: triangular2
    step_size_up: 10
    step_size_down: 190

aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00003

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.0001
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 0.01

epochs: 200

aux_optimizer_delay: 5

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.8.1

project_name: INZ
task_name: v0.8.1 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  Try without GDN after stage