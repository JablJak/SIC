dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 25
    subset_samples: 40

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_s
    decoder_depths: [2, 18, 2, 2]

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00001

scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.000005
    T_max: 200


aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00003

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.0001
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 0.01

epochs: 200

aux_optimizer_delay: 20

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.16.0

project_name: INZ
task_name: v0.16.0 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  - Disable activation in upscaling