
train_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [0.470, 0.447, 0.408]
        std: [0.270, 0.266, 0.281]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: 256
        resize_size: 256
  args:
    variant: train
    subset_classes: 1
    subset_samples: 131072

val_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
        normalize: false
  args:
    variant: val
    subset_classes: 1
    subset_samples: 1024

test_dataset:
  module: src.data.kodak_dataset.KodakDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: true
  args:
    subset_classes: 25
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_s
    encoder_embed_dim: 96
    encoder_dims: [ 96, 192, 384, 768 ]
    encoder_depths: [ 2, 2, 16, 6 ]
    encoder_num_heads: [ 3, 6, 12, 24 ]
    encoder_window_size: [ 8, 8 ]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [ 6, 16, 2, 2 ]
    decoder_dims: [ 768, 384, 192, 96, 48 ]
    decoder_num_heads: [ 24, 12, 6, 3 ]
    decoder_window_size: [ [ 8, 8 ], [ 8, 8 ], [ 8, 8 ], [ 8, 8 ] ]
    decoder_mlp_ratio: [ 4, 4, 4, 4 ]
    decoder_sd_factor: 0.1
    no_compress: false

dataloader:
  args:
    batch_size: 2
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: lion_pytorch.Lion
  args:
    lr: !!float 1e-5
    weight_decay: !!float 1e-6
    betas: [0.95, 0.98]

#optimizer:
#  module: sophia.sophia.SophiaG
#  args:
#    lr: !!float 2e-5
#    rho: 0.03
#    betas: [ 0.9, 0.99 ]

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  enabled: false
  args:
    total_iters: 10
    start_factor: 1.0
    end_factor: 0.25

aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 1e-3

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: false
  args:
    eta_min: 0.0005
    T_max: 200

loss:
  module: src.losses.l1_ssim.L1SSIM
  args:
    alpha: 0.2

rd_loss:
  enabled: true
  lambda: !!float 1e-3

epochs: 400
log_frequency: 100
accumulation_steps: 8

aux_optimizer_delay: 0

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.74.0

project_name: INZ
task_name: v0.74.0 SWIN-S Transformer Autoencoder based Image Compression
comment: |
