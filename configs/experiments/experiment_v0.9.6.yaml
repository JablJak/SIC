dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 20
    subset_samples: 50

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    decoder_patch_size: 2
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0003

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: 0.0001
    max_lr: 0.0003
    mode: triangular2
    step_size_up: 10
    step_size_down: 390

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 100000

epochs: 400

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.9.6

project_name: INZ
task_name: v0.9.6 SWIN Transformer Autoencoder based Image Compression
comment: |
  - Bring back hyperprior
  - Entropy model scheduler
