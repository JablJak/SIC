dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 20
    subset_samples: 50

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0002

scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.00005
    T_max: 300

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 100000

epochs: 500

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.1.4

project_name: INZ
task_name: v0.1.4 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  0.6.0 has SWIN S architecture
