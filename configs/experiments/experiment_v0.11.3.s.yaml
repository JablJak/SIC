dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 25
    subset_samples: 400

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: true
    encoder_type: gdn_swin_v2_s
    decoder_depths: [2, 18, 2, 2]
    decoder_mlp_ratio : [2, 2, 2, 2]
    decoder_sd_factor: 0.3

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.000075

scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.0000025
    T_max: 100


aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00003

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.0001
    T_max: 100

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 0.01

epochs: 100

aux_optimizer_delay: 5

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.11.3

project_name: INZ
task_name: v0.11.3 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  - Restore two layer norms in mlp
  - Decrease mlp ratio to 2