train_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [0.470, 0.447, 0.408]
        std: [0.270, 0.266, 0.281]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: 256
        resize_size: 256
  args:
    subset_classes: 1
    subset_samples: 16384

val_dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
        normalize: false
  args:
    variant: val.X
    subset_classes: 25
    subset_samples: 40

test_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        normalize: false
        crop_size: 512
        resize_size: 512
  args:
    subset_classes: 1
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_s
    encoder_embed_dim: 96
    encoder_dims: [96, 192, 384, 512]
    encoder_depths: [2, 2, 18, 2]
    encoder_num_heads: [3, 6, 12, 16]
    encoder_window_size: [8, 8]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [2, 18, 2, 2]
    decoder_dims: [512, 384, 192, 96, 48]
    decoder_num_heads: [16, 12, 6, 3]
    decoder_window_size: [[8, 8], [8, 8], [8, 8], [8, 8]]
    decoder_mlp_ratio: [4, 4, 4, 4]
    decoder_sd_factor: 0.1
    no_compress: true

dataloader:
  args:
    batch_size: 12
    shuffle: true
    num_workers: 6
    pin_memory: false

optimizer:
  module: sophia.sophia.SophiaG
  args:
    lr: !!float 5e-5
    rho: 0.075
    betas: [ 0.9, 0.99 ]

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  enabled: true
  args:
    start_factor: 1.0
    end_factor: 0.1
    total_iters: 50

aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.001

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: false
  args:
    eta_min: 0.0005
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: false
  lambda: !!float 1e-3

epochs: 400

aux_optimizer_delay: 0

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC-BASE
    version: 0.60.0

project_name: INZ
task_name: v0.60.0 SWIN-S Transformer Autoencoder based Image Compression
comment: |
 - residuals