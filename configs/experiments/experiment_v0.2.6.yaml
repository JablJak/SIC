dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  args:
    subset_classes: 20
    subset_samples: 200

model:
  module: src.models.swin_autoencoder.SwinTransformerAutoencoder
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.SGD
  args:
    lr: 0.05
    weight_decay: 0.0004

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: 0.001
    max_lr: 0.05

loss:
  module: src.losses.mse_ssim.MSESSIM
  args: {}

epochs: 300

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.2.6

project_name: INZ
task_name: SWIN Transformer Autoencoder based Image Compression v0.2.6
comment: |
  Same as v0.2.0 but with SGD and CyclicLR
  
  
