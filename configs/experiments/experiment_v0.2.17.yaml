dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  args:
    subset_classes: 20
    subset_samples: 200

model:
  module: src.models.swin_autoencoder.SwinTransformerAutoencoder
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.001

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: 0.0005
    max_lr: 0.001
    mode: triangular2
    step_size_up: 30
    step_size_down: 50

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0.2

epochs: 400

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.2.17

project_name: INZ
task_name: SWIN Transformer Autoencoder based Image Compression v0.2.17
comment: |
  v0.2.16 with lowered msssim gaussian kernel
  
  
