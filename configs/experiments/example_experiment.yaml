dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  args:
    subset_classes: 20
    subset_samples: 200

model:
  module: src.models.swin_autoencoder.SwinTransformerAutoencoder
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.SGD
  args:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  args:
    start_factor: 0.5
    total_iters: 4

epochs: 300

output:
  model:
    name: SWIN-T-IC
    version: 0.1.0-test

project_name: INZ
task_name: SWIN Autoencoder v0.2.1
comments: An example experiment on SWIN Autoencoder
