dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.YCbCrCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 3
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  weights: SWIN-T-IC_0.4.1-test
  args:
    pretrained_encoder: false

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00025

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: 0.00025
    max_lr: 0.001
    mode: triangular2
    step_size_up: 10
    step_size_down: 40

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 50000

epochs: 5

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.4.1-test

project_name: INZ
task_name: TEST v0.4.1 SWIN Transformer Autoencoder based Image Compression
comment: |
  
  
