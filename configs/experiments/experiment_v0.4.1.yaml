dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.YCbCrCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 20
    subset_samples: 50

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0001

scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: 0.0001
    max_lr: 0.001
    mode: triangular2
    step_size_up: 10
    step_size_down: 40

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 500000

epochs: 500

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.4.1

project_name: INZ
task_name: v0.4.1 SWIN Transformer Autoencoder based Image Compression
comment: |
  0.4.0 with lambda=500000 and more classes/less samples