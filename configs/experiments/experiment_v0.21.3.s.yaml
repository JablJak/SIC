train_dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 25
    subset_samples: 40

val_dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: val.X
    subset_classes: 25
    subset_samples: 40

test_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
  args:
    subset_classes: 1
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_s
    encoder_embed_dim: 128
    encoder_dims: [128, 256, 512, 384]
    encoder_depths: [6, 6, 18, 6]
    encoder_num_heads: [4, 8, 16, 12]
    encoder_window_size: [8, 8]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [6, 18, 6, 6, 2]
    decoder_dims: [384, 512, 256, 128, 64, 32]
    decoder_num_heads: [12, 16, 8, 4, 2]
    decoder_window_size: [[8, 8], [8, 8], [8, 8], [8, 8], [8, 8]]
    decoder_mlp_ratio: [4, 4, 4, 4, 4]
    decoder_sd_factor: 0.1

dataloader:
  args:
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 2.5e-6


scheduler:
  module: torch.optim.lr_scheduler.CyclicLR
  enabled: true
  args:
    base_lr: !!float 2e-6
    max_lr: !!float 1e-5
    mode: triangular2
    step_size_up: 20
    step_size_down: 50

aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0001

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.00005
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 100

epochs: 200

aux_optimizer_delay: 10

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.21.3

project_name: INZ
task_name: v0.21.3 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  - More convolution in reconstruction
  - Deeper model