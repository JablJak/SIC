dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  args:
    subset_classes: 20
    subset_samples: 200

model:
  module: src.models.swin_autoencoder.SwinTransformerAutoencoder
  weights: null
  args:
    pretrained_encoder: true

dataloader:
  args:
    batch_size: 16
    shuffle: true
    num_workers: 8

optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.0001
    weight_decay: 0.02

scheduler:
  enabled: false

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0.2

epochs: 300

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-T-IC
    version: 0.2.2

project_name: INZ
task_name: SWIN Transformer Autoencoder based Image Compression v0.2.2
comment: |
  Similar to v0.2.0 but with MSESSIM alpha set to 0.2
  
  
