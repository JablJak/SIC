train_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [0.470, 0.447, 0.408]
        std: [0.270, 0.266, 0.281]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: 256
        resize_size: 256
  args:
    variant: train
    subset_classes: 1
    subset_samples: 16384

val_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: 256
        resize_size: 256
        normalize: false
  args:
    variant: val
    subset_classes: 1
    subset_samples: 1024

test_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        normalize: false
        crop_size: 512
        resize_size: 512
  args:
    variant: test
    subset_classes: 1
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  weights: SWIN-B-IC-BASE_0.1.0
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_b
    encoder_embed_dim: 128
    encoder_dims: [128, 256, 512, 1024]
    encoder_depths: [2, 2, 16, 2]
    encoder_num_heads: [4, 8, 16, 32]
    encoder_window_size: [8, 8]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [2, 18, 2, 2]
    decoder_dims: [1024, 512, 256, 128, 64]
    decoder_num_heads: [32, 16, 8, 4]
    decoder_window_size: [[8, 8], [8, 8], [8, 8], [8, 8]]
    decoder_mlp_ratio: [4, 4, 4, 4]
    decoder_sd_factor: 0.1
    no_compress: false

dataloader:
  args:
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.SGD
  args:
    lr: [!!float 1e-2, !!float 1e-2]
    weight_decay: !!float 1e-5

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  enabled: true
  args:
    start_factor: 1.0
    end_factor: 0.01
    total_iters: 10

aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 5e-4

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: false
  args:
    eta_min: 0.0005
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: !!float 5e-4

epochs: 400

aux_optimizer_delay: 0

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-B-IC
    version: 0.1.1

project_name: INZ
task_name: v0.1.1 SWIN-B Transformer Autoencoder based Image Compression
comment: |
