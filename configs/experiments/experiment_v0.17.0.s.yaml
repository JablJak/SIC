train_dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: train.X1
    subset_classes: 25
    subset_samples: 400

val_dataset:
  module: src.data.imagenet_dataset.ImageNetDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args: {}
  args:
    variant: val.X
    subset_classes: 25
    subset_samples: 40

test_dataset:
  module: src.data.coco_dataset.CocoDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        crop_size: 512
        resize_size: 512
  args:
    subset_classes: 1
    subset_samples: 100

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_s
    encoder_embed_dim: 128
    encoder_dims: [128, 192, 384, 384]
    encoder_depths: [2, 4, 16, 4]
    encoder_num_heads: [2, 3, 6, 6]
    encoder_window_size: [8, 8]
    encoder_sd_factor: 0.3
    encoder_mlp_ratio: 4
    decoder_depths: [4, 16, 4, 2]
    decoder_dims: [384, 384, 192, 128, 64]
    decoder_num_heads: [6, 6, 3, 2]
    decoder_window_size: [[8, 8], [8, 8], [8, 8], [8, 8]]
    decoder_mlp_ratio: [4, 4, 4, 4]
    decoder_sd_factor: 0.3

dataloader:
  args:
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: false

optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 2.5e-5

scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: !!float 5e-6
    T_max: 200


aux_optimizer:
  module: torch.optim.AdamW
  args:
    lr: 0.00003

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: true
  args:
    eta_min: 0.0001
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0

rd_loss:
  enabled: true
  lambda: 0.05

epochs: 200

aux_optimizer_delay: 5

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-S-IC
    version: 0.17.0

project_name: INZ
task_name: v0.17.0 SWIN-S Transformer Autoencoder based Image Compression
comment: |
  - Architecture experiments
  - Val dataset smaller
  - Test dataset and calculate psnr/bpp precisely