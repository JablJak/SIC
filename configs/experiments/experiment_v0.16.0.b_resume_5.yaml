train_dataset:
  module: src.data.div2k_dataset.DIV2KDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [0.470, 0.447, 0.408]
        std: [0.270, 0.266, 0.281]
        normalize: true
        crop_size: [256, 256]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: [256, 256]
  args:
    variant: train
    subset_classes: 25
    subset_samples: 131072

val_dataset:
  module: src.data.div2k_dataset.DIV2KDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: true
        crop_size: [256, 256]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        crop_size: [256, 256]
        normalize: false
  args:
    variant: val
    subset_classes: 1
    subset_samples: 1024

test_dataset:
  module: src.data.kodak_dataset.KodakDataset
  transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: true
        crop_size: [512, 512]
  target_transform:
    - module: src.data.transforms.RGBCompression
      args:
        mean: [ 0.470, 0.447, 0.408 ]
        std: [ 0.270, 0.266, 0.281 ]
        normalize: false
        crop_size: [512, 512]
  args: {}

model:
  module: src.models.swin_compression.SwinTransformerCompressionAutoencoder
  args:
    pretrained_encoder: false
    encoder_type: gdn_swin_v2_b
    encoder_embed_dim: 128
    encoder_dims: [ 128, 256, 512 ]
    encoder_depths: [ 2, 6, 24 ]
    encoder_num_heads: [ 4, 8, 16 ]
    encoder_window_size: [8, 8]
    encoder_sd_factor: 0.1
    encoder_mlp_ratio: 4
    decoder_depths: [ 24, 6, 2 ]
    decoder_dims: [ 512, 256, 128, 64 ]
    decoder_num_heads: [ 16, 8, 4 ]
    decoder_window_size: [ [8, 8], [8, 8], [8, 8] ]
    decoder_mlp_ratio: [ 4, 4, 4 ]
    decoder_sd_factor: 0.05
    bottleneck_dim: 384
    no_compress: false
    checkpointing: true

dataloader:
  args:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true

optimizer:
  module: torch.optim.AdamW
  args:
    lr: !!float 1e-5
  first_lr: !!float 1e-5
  second_lr: !!float 1e-5
  third_lr: !!float 1e-5
  fourth_lr: !!float 1e-5

scheduler:
  module: torch.optim.lr_scheduler.LinearLR
  enabled: false
  args:
    total_iters: 5000
    start_factor: 0.001
    end_factor: 1.0

aux_optimizer:
  module: torch.optim.Adam
  args:
    lr: !!float 1e-4

aux_scheduler:
  module: torch.optim.lr_scheduler.CosineAnnealingLR
  enabled: false
  args:
    eta_min: 0.0005
    T_max: 200

loss:
  module: src.losses.mse_ssim.MSESSIM
  args:
    alpha: 0.1

rd_loss:
  enabled: true
  lambda: !!float 0.18

epochs: 5000
log_frequency: 100
accumulation_steps: 8

aux_optimizer_delay: 0

dataset_split_ratio: 0.7

output:
  model:
    name: SWIN-B-IC
    version: 0.16.0

project_name: INZ
task_name: v0.16.0 SWIN-B Transformer Autoencoder based Image Compression
comment: |
  - remove conv after upscaling and change output activation to clamp